<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Task</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:#101010;
color:#eee
}

.app{
display:flex;
min-height:100vh
}

.side{
width:230px;
background:#171717;
border-right:1px solid #292929;
padding:25px 16px
}

.logo{
font-size:23px;
font-weight:800;
margin:0 10px 25px
}

.logo span{
color:#9b91ff
}

.nav{
display:flex;
gap:10px;
align-items:center;
padding:11px 13px;
border-radius:10px;
margin:5px 0;
cursor:pointer;
color:#aaa
}

.nav.active,.nav:hover{
background:#252525;
color:#b8b0ff
}

.count{
margin-left:auto;
font-size:12px;
color:#999
}

.main{
flex:1;
max-width:1050px;
margin:auto;
padding:35px 42px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px
}

h1{
margin:0;
font-size:30px
}

.add{
border:0;
background:#7468ff;
color:white;
padding:12px 18px;
border-radius:11px;
font-weight:700;
cursor:pointer
}

.card{
background:#191919;
border:1px solid #2b2b2b;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 3px 12px #22200008
}

.task{
display:flex;
align-items:center;
gap:13px
}

.check{
width:21px;
height:21px;
border:2px solid #666;
border-radius:50%;
cursor:pointer;
flex:none
}

.done .check{
background:#655cff;
border-color:#655cff;
position:relative
}

.done .check:after{
content:"✓";
color:#fff;
position:absolute;
left:3px;
top:-2px;
font-size:14px
}

.done .name{
text-decoration:line-through;
color:#aaa
}

.name{
font-weight:650;
flex:1
}

.dates{
font-size:12px;
color:#777;
margin-left:34px;
margin-top:5px
}

.tag{
background:#292538;
color:#b8b0ff;
padding:5px 9px;
border-radius:8px;
font-size:11px
}

.delete{
border:0;
background:none;
color:#aaa;
cursor:pointer;
font-size:18px
}

.empty{
text-align:center;
color:#999;
padding:60px 10px
}

/* モーダル */

.modal{
display:none;
position:fixed;
inset:0;
background:#0006;
align-items:center;
justify-content:center;
padding:20px
}

.modal.show{
display:flex
}

.box{
background:#191919;
border-radius:18px;
width:min(480px,100%);
padding:25px
}

.box h2{
margin-top:0
}

.field{
margin:14px 0
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:6px;
color:#aaa
}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #3a3a3a;
background:#111;
color:#eee;
border-radius:9px;
font:inherit
}

textarea{
resize:vertical;
min-height:80px
}

.row{
display:flex;
gap:10px
}

.row>*{
flex:1
}

.actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:20px
}

.cancel{
border:0;
background:#303030;
color:#eee;
padding:11px 16px;
border-radius:9px;
cursor:pointer
}

.save{
border:0;
background:#655cff;
color:#fff;
padding:11px 18px;
border-radius:9px;
font-weight:700;
cursor:pointer
}

/* ほしいもの */

.wish-price{
font-size:14px;
font-weight:700;
color:#b8b0ff;
margin-top:5px
}

.wish-info{
font-size:12px;
color:#888;
margin-top:8px;
line-height:1.6
}

.priority{
display:inline-block;
padding:4px 8px;
border-radius:7px;
background:#292538;
color:#b8b0ff;
font-size:11px;
margin-left:5px
}

.wish-link{
color:#9b91ff;
font-size:12px;
text-decoration:none
}

.wish-link:hover{
text-decoration:underline
}

.purchased{
opacity:.55
}

.purchased .wish-name{
text-decoration:line-through
}

.purchase-check{
width:21px;
height:21px;
border:2px solid #666;
border-radius:50%;
cursor:pointer;
flex:none;
display:flex;
align-items:center;
justify-content:center
}

.purchased .purchase-check{
background:#655cff;
border-color:#655cff
}

.purchased .purchase-check:after{
content:"✓";
color:#fff;
font-size:14px
}

.wish-name{
font-weight:650;
flex:1
}

@media(max-width:700px){

.side{
width:70px;
padding:20px 8px
}

.logo{
font-size:0;
text-align:center
}

.logo span{
font-size:23px
}

.nav span:not(.count){
display:none
}

.main{
padding:25px 15px
}

.top{
align-items:flex-start
}

}
</style>
</head>

<body>

<div class="app">

<aside class="side">

<div class="logo">
My<span>Task</span>
</div>

<div class="nav active" id="navAll" onclick="showPage('tasks','all')">
📋 <span>すべて</span>
<span class="count" id="allCount">0</span>
</div>

<div class="nav" id="navActive" onclick="showPage('tasks','active')">
🔥 <span>未完了</span>
<span class="count" id="activeCount">0</span>
</div>

<div class="nav" id="navDone" onclick="showPage('tasks','done')">
✓ <span>完了</span>
<span class="count" id="doneCount">0</span>
</div>

<div class="nav" id="navSomeday" onclick="showPage('tasks','someday')">
🌙 <span>いつか</span>
</div>

<div class="nav" id="navWishlist" onclick="showPage('wishlist')">
🛒 <span>ほしいもの</span>
<span class="count" id="wishCount">0</span>
</div>

</aside>


<main class="main">

<div class="top">

<div>

<h1 id="title">すべて</h1>

<div id="subtitle"
style="color:#999;font-size:13px;margin-top:4px">
やることを整理しよう
</div>

</div>

<button class="add" id="addButton" onclick="openModal()">
＋ タスクを追加
</button>

</div>

<div id="list"></div>

</main>

</div>


<!-- タスク追加 -->

<div class="modal" id="modal">

<div class="box">

<h2>タスクを追加</h2>

<div class="field">
<label>タスク名</label>
<input id="name" placeholder="例：数学の宿題">
</div>

<div class="field">

<label>予定の種類</label>

<select id="kind" onchange="updateFields()">

<option value="single">その日だけ</option>

<option value="range">
期間（開始日～締切日）
</option>

<option value="someday">
いつか
</option>

</select>

</div>


<div class="row" id="singleRow">

<div class="field">

<label>日付</label>

<input id="date" type="date">

</div>

</div>


<div class="row" id="rangeRow" style="display:none">

<div class="field">

<label>開始日</label>

<input id="start" type="date">

</div>

<div class="field">

<label>締切日</label>

<input id="due" type="date">

</div>

</div>


<div class="actions">

<button class="cancel" onclick="closeModal()">
キャンセル
</button>

<button class="save" onclick="saveTask()">
追加する
</button>

</div>

</div>

</div>


<!-- ほしいもの追加 -->

<div class="modal" id="wishModal">

<div class="box">

<h2>ほしいものを追加</h2>

<div class="field">

<label>商品名</label>

<input
id="wishName"
placeholder="例：Pentel Smash 0.5mm">

</div>


<div class="field">

<label>値段</label>

<input
id="wishPrice"
type="number"
min="0"
placeholder="例：1500">

</div>


<div class="field">

<label>優先度</label>

<select id="wishPriority">

<option value="高">高</option>

<option value="中" selected>中</option>

<option value="低">低</option>

</select>

</div>


<div class="field">

<label>URL</label>

<input
id="wishUrl"
type="url"
placeholder="https://...">

</div>


<div class="field">

<label>メモ</label>

<textarea
id="wishMemo"
placeholder="色やサイズなど"></textarea>

</div>


<div class="actions">

<button class="cancel" onclick="closeWishModal()">
キャンセル
</button>

<button class="save" onclick="saveWish()">
追加する
</button>

</div>

</div>

</div>


<script>

let tasks=JSON.parse(
localStorage.getItem("myTasks")||"[]"
);

let wishlist=JSON.parse(
localStorage.getItem("myWishlist")||"[]"
);

let filter="all";

let page="tasks";


const $=id=>document.getElementById(id);


/* -------------------------
   共通
------------------------- */

function esc(s){

return String(s||"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


/* -------------------------
   タスク
------------------------- */

function save(){

localStorage.setItem(
"myTasks",
JSON.stringify(tasks)
);

}


function openModal(){

$("modal").classList.add("show");

$("name").focus();

}


function closeModal(){

$("modal").classList.remove("show");

$("name").value="";
$("date").value="";
$("start").value="";
$("due").value="";
$("kind").value="single";

updateFields();

}


function updateFields(){

let k=$("kind").value;

$("singleRow").style.display=
k==="single"?"flex":"none";

$("rangeRow").style.display=
k==="range"?"flex":"none";

}


function saveTask(){

let name=$("name").value.trim();

if(!name)return;

let kind=$("kind").value;

let t={

id:Date.now(),

name:name,

date:$("date").value,

start:$("start").value,

due:$("due").value,

someday:kind==="someday",

kind:kind,

done:false

};

tasks.push(t);

save();

closeModal();

render();

}


function toggle(id){

let t=tasks.find(x=>x.id===id);

if(!t)return;

t.done=!t.done;

save();

render();

}


function del(id){

tasks=tasks.filter(
x=>x.id!==id
);

save();

render();

}


function fmt(x){

if(!x)return "";

let [y,m,d]=x.split("-");

return `${m}/${d}`;

}


/* -------------------------
   ページ切り替え
------------------------- */

function showPage(newPage,newFilter="all"){

page=newPage;

filter=newFilter;

document.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

if(page==="wishlist"){

$("navWishlist").classList.add("active");

$("title").textContent="ほしいもの";

$("subtitle").textContent=
"ほしいものをまとめて管理しよう";

$("addButton").textContent=
"＋ ほしいものを追加";

$("addButton").onclick=
openWishModal;

renderWishlist();

}else{

if(filter==="all")
$("navAll").classList.add("active");

if(filter==="active")
$("navActive").classList.add("active");

if(filter==="done")
$("navDone").classList.add("active");

if(filter==="someday")
$("navSomeday").classList.add("active");

$("title").textContent=
filter==="all"
?"すべて"
:filter==="active"
?"未完了"
:filter==="done"
?"完了"
:"いつか";

$("subtitle").textContent=
"やることを整理しよう";

$("addButton").textContent=
"＋ タスクを追加";

$("addButton").onclick=
openModal;

render();

}

}


/* -------------------------
   タスク表示
------------------------- */

function render(){

if(page!=="tasks")return;

let shown=tasks.filter(
t=>
filter==="all"
||
filter==="active"&&!t.done
||
filter==="done"&&t.done
||
filter==="someday"&&t.someday
);


$("allCount").textContent=
tasks.length;

$("activeCount").textContent=
tasks.filter(t=>!t.done).length;

$("doneCount").textContent=
tasks.filter(t=>t.done).length;


$("list").innerHTML=

shown.length

?

shown.map(t=>`

<div class="card ${t.done?"done":""}">

<div class="task">

<div
class="check"
onclick="toggle(${t.id})">
</div>

<div class="name">
${esc(t.name)}
</div>

${t.someday
?'<span class="tag">いつか</span>'
:""}

<button
class="delete"
onclick="del(${t.id})">
×
</button>

</div>

${!t.someday

?`

<div class="dates">

📅

${
t.kind==="single"

?(t.date
?fmt(t.date)
:"日付なし")

:

(t.start
?fmt(t.start)
:"—")

+
" "

+
(t.due
?"～ "+fmt(t.due)
:"")

}

</div>

`

:""}

</div>

`).join("")

:

'<div class="empty">ここにはタスクがありません ✨</div>';

}


/* -------------------------
   ほしいもの
------------------------- */

function saveWishlist(){

localStorage.setItem(
"myWishlist",
JSON.stringify(wishlist)
);

}


function openWishModal(){

$("wishModal").classList.add("show");

$("wishName").focus();

}


function closeWishModal(){

$("wishModal").classList.remove("show");

$("wishName").value="";
$("wishPrice").value="";
$("wishPriority").value="中";
$("wishUrl").value="";
$("wishMemo").value="";

}


function saveWish(){

let name=$("wishName").value.trim();

if(!name)return;


let item={

id:Date.now(),

name:name,

price:$("wishPrice").value,

priority:$("wishPriority").value,

url:$("wishUrl").value.trim(),

memo:$("wishMemo").value.trim(),

purchased:false

};


wishlist.push(item);

saveWishlist();

closeWishModal();

renderWishlist();

}


function toggleWish(id){

let item=wishlist.find(
x=>x.id===id
);

if(!item)return;

item.purchased=!item.purchased;

saveWishlist();

renderWishlist();

}


function deleteWish(id){

wishlist=wishlist.filter(
x=>x.id!==id
);

saveWishlist();

renderWishlist();

}


function renderWishlist(){

if(page!=="wishlist")return;


$("wishCount").textContent=
wishlist.filter(x=>!x.purchased).length;


if(wishlist.length===0){

$("list").innerHTML=
'<div class="empty">ほしいものはまだありません 🛒</div>';

return;

}


$("list").innerHTML=

wishlist.map(item=>`

<div class="card ${item.purchased?"purchased":""}">

<div class="task">

<div
class="purchase-check"
onclick="toggleWish(${item.id})">
</div>

<div class="wish-name">
${esc(item.name)}

<span class="priority">
優先度：${esc(item.priority)}
</span>

</div>

<button
class="delete"
onclick="deleteWish(${item.id})">
×
</button>

</div>


${item.price

?`

<div class="wish-price">
¥${Number(item.price).toLocaleString()}
</div>

`

:""}


${item.memo

?`

<div class="wish-info">
📝 ${esc(item.memo)}
</div>

`

:""}


${item.url

?`

<div class="wish-info">

🔗

<a
class="wish-link"
href="${esc(item.url)}"
target="_blank"
rel="noopener noreferrer">

商品ページを開く

</a>

</div>

`

:""}

</div>

`).join("");

}


/* -------------------------
   モーダル外クリック
------------------------- */

$("modal").addEventListener(
"click",
e=>{
if(e.target===$("modal"))
closeModal();
}
);


$("wishModal").addEventListener(
"click",
e=>{
if(e.target===$("wishModal"))
closeWishModal();
}
);


/* -------------------------
   最初の表示
------------------------- */

showPage("tasks","all");

</script>

</body>
</html>
